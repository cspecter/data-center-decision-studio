name: Publish site to GitHub Pages

# Publishing is deliberately manual: all deployed static files (including the
# baseline financial workbook-derived JSON) can be inspected by website visitors.
on:
  workflow_dispatch:
    inputs:
      acknowledge_public_model:
        description: 'I understand the website and its baseline model data will be public'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ inputs.acknowledge_public_model == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: npm test
      - name: Build static website
        run: npm run build
      - name: Prepare Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    if: ${{ inputs.acknowledge_public_model == true }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
